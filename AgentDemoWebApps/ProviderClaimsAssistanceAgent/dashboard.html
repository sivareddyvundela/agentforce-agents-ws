<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>healthEdge AI - Provider Claims Assistance</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="dashboard-body">

<div class="app-shell">

  <!-- ===================== TOP HEADER ===================== -->
  <header class="app-header">
    <button class="hamburger-btn" id="hamburgerBtn" aria-label="Toggle navigation">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none"><path d="M4 6H20M4 12H20M4 18H20" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <div class="header-brand">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M12 2L3 6V11C3 16.55 6.84 21.74 12 23C17.16 21.74 21 16.55 21 11V6L12 2Z" fill="url(#gradMarkH)"/>
        <path d="M9 12L11 14L15.5 9.5" stroke="white" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
        <defs>
          <linearGradient id="gradMarkH" x1="3" y1="2" x2="21" y2="23" gradientUnits="userSpaceOnUse">
            <stop stop-color="#D97706"/>
            <stop offset="1" stop-color="#F59E0B"/>
          </linearGradient>
        </defs>
      </svg>
      <span class="header-wordmark">healthEdge <strong>AI</strong></span>
      <span class="header-divider">|</span>
      <span class="header-title">Provider Claims Assistance</span>
    </div>
    <button class="btn-signout" id="signOutBtn">Sign Out</button>
  </header>

  <div class="app-body">

    <!-- ===================== SIDEBAR NAV ===================== -->
    <nav class="app-sidebar" id="appSidebar">
      <ul class="nav-list" id="navList">
        <!-- populated by app.js -->
      </ul>
    </nav>

    <!-- ===================== MAIN CONTENT ===================== -->
    <main class="app-main" id="appMain">

      <!-- ---------- Overview ---------- -->
      <section class="tab-panel" id="panel-overview" data-panel="overview">
        <h1 class="panel-title">Overview</h1>
        <p class="panel-lede" id="overviewDescription"></p>
        <div class="stat-tile-row" id="statTileRow"></div>
      </section>

      <!-- ---------- Claim Lookup ---------- -->
      <section class="tab-panel" id="panel-claimLookup" data-panel="claimLookup" hidden>
        <h1 class="panel-title">Claim Lookup</h1>
        <p class="panel-lede">Example lookup result for claim number <strong>CLM-00042</strong>.</p>
        <div class="profile-card" id="claimLookupCard"></div>
      </section>

      <!-- ---------- Claim History ---------- -->
      <section class="tab-panel" id="panel-claimHistory" data-panel="claimHistory" hidden>
        <h1 class="panel-title">Claim History</h1>
        <div class="table-wrap">
          <table class="data-table" id="claimHistoryTable">
            <thead>
              <tr><th>Claim Number</th><th>Claim Type</th><th>Status</th><th>Initiation Date</th><th>Approved Amount</th></tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>
      </section>

    </main>
  </div>
</div>

<!-- The floating chat launcher used to be a static stub here. Now that
     the real Agentforce embed is wired in below, its own launcher
     button renders itself once embeddedservice_bootstrap.init()
     succeeds — keeping the old stub button/panel around would show
     two overlapping chat launchers. -->

<script src="assets/js/data.js"></script>
<script src="assets/js/app.js"></script>

<!-- ============================================================
     AGENTFORCE EMBED SCRIPT
     Loads only for authenticated sessions (guarded by the same
     heAI_authenticated flag app.js checks on this page), and passes
     the logged-in user's identity to the agent via hidden
     prechat fields before init.
     ============================================================ -->
<script type="text/javascript">
 if (sessionStorage.getItem('heAI_authenticated') === 'true') {
  function initEmbeddedMessaging() {
   try {
    embeddedservice_bootstrap.settings.language = 'en_US'; // For example, enter 'en' or 'en-US'

    embeddedservice_bootstrap.init(
     '00DHs00000TTGXG',
     'HealthBridge_Provider_Claims_Assistance_Agent',
     'https://wi1778260356875.my.site.com/ESWHealthBridgeProvider1785153554345',
     {
      scrt2URL: 'https://wi1778260356875.my.salesforce-scrt.com'
     }
    );
   } catch (err) {
    console.error('Error loading Embedded Messaging: ', err);
   }
  }

  // Pass the logged-in user's identity to the agent once the SDK is
  // ready. setHiddenPrechatFields must run after init() resolves, not
  // before — calling it earlier throws (prechatAPI isn't populated
  // yet), which previously aborted init() itself since both calls
  // shared one try block. data.js has no logged-in-caller identity
  // object here (only the looked-up `currentClaim` record), so the
  // username entered at login is the closest identity available.
  // NOTE: these hidden-field developer names must match the Hidden
  // Prechat Fields configured on this Embedded Service Deployment in
  // Setup (HealthBridge_Provider_Claims_Assistance_Agent) — adjust
  // the keys below if yours differ.
  window.addEventListener('onEmbeddedMessagingReady', function () {
   try {
    var loggedInUsername = sessionStorage.getItem('heAI_username');
    if (loggedInUsername) {
     embeddedservice_bootstrap.prechatAPI.setHiddenPrechatFields({
      Username: loggedInUsername
     });
    }
   } catch (err) {
    console.error('Error setting hidden prechat fields: ', err);
   }
  });

  var eswScript = document.createElement('script');
  eswScript.type = 'text/javascript';
  eswScript.src = 'https://wi1778260356875.my.site.com/ESWHealthBridgeProvider1785153554345/assets/js/bootstrap.min.js';
  eswScript.onload = initEmbeddedMessaging;
  document.body.appendChild(eswScript);
 }
</script>
</body>
</html>
