<template>
<lightning-card title="Enrollment Details">
<div class="slds-p-horizontal_medium">
<!-- First Name -->
<lightning-input label="First Name" name="firstName" value={firstName} type="text"
                onchange={handleInputChange} read-only={readOnly} required>
</lightning-input>
 
            <!-- Last Name -->
<lightning-input label="Last Name" name="lastName" value={lastName} type="text"
                onchange={handleInputChange} read-only={readOnly} required>
</lightning-input>
 
            <!-- Phone -->
<lightning-input label="Phone" name="phone" value={phone} type="tel"
                onchange={handleInputChange} read-only={readOnly} required>
</lightning-input>
 
            <!-- Email -->
<lightning-input label="Email" name="email" value={email} type="email"
                onchange={handleInputChange} read-only={readOnly} required>
</lightning-input>
 
            <!-- NPI Number -->
<lightning-input label="NPI Number" name="npiNumber" value={npiNumber} type="text"
                onchange={handleInputChange} read-only={readOnly} required>
</lightning-input>
 
            <!-- License Number -->
<lightning-input label="License Number" name="licenseNumber" value={licenseNumber} type="text"
                onchange={handleInputChange} read-only={readOnly} required>
</lightning-input>
 
            <!-- Specialist (Picklist) -->
<lightning-combobox label="Specialist" name="specialist" value={specialist}
                options={specialistOptions} onchange={handleInputChange} disabled={readOnly} required>
</lightning-combobox>
 
            <!-- Network -->
<lightning-input label="Network" name="network" value={network} type="text"
                onchange={handleInputChange} read-only={readOnly} required>
</lightning-input>
 
            <!-- Document Upload -->
<div class="slds-form-element slds-p-top_small">
<label class="slds-form-element__label" for="fileUpload">Upload Supporting Document</label>
<div class="slds-form-element__control">
<lightning-file-upload
    type="file"
    label="Upload Document"
    name="fileUpload"
    accept=".pdf,.png"
    onchange={handleFileUpload}>
</lightning-file-upload>                     
</div>
<template if:true={fileName}>
<p class="slds-text-body_small slds-p-top_xx-small">
                        Selected file: {fileName}
</p>
</template>
<template if:true={fileError}>
<p class="slds-text-color_error slds-text-body_small slds-p-top_xx-small">
                        {fileError}
</p>
</template>
</div>
</div>
</lightning-card>
</template>
