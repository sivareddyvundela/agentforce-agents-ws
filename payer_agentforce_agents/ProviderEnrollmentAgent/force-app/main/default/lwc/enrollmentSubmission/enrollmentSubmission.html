<template>
    <lightning-card title="Provider Enrollment Details">
 
        <div class="form-container">
 
            <div class="form-grid">
 
                <!-- First Name -->
                <lightning-input
                    label="First Name"
                    name="firstName"
                    value={firstName}
                    type="text"
                    onchange={handleInputChange}
                    read-only={readOnly}
                    required>
                </lightning-input>
 
                <!-- Last Name -->
                <lightning-input
                    label="Last Name"
                    name="lastName"
                    value={lastName}
                    type="text"
                    onchange={handleInputChange}
                    read-only={readOnly}
                    required>
                </lightning-input>
 
                <!-- Phone -->
                <lightning-input
                    label="Phone"
                    name="phone"
                    value={phone}
                    type="tel"
                    onchange={handleInputChange}
                    read-only={readOnly}
                    required>
                </lightning-input>
 
                <!-- Email -->
                <lightning-input
                    label="Email"
                    name="email"
                    value={email}
                    type="email"
                    onchange={handleInputChange}
                    read-only={readOnly}
                    required>
                </lightning-input>
 
                <!-- NPI Number -->
                <lightning-input
                    label="NPI Number"
                    name="npiNumber"
                    value={npiNumber}
                    type="text"
                    onchange={handleInputChange}
                    read-only={readOnly}
                    required>
                </lightning-input>
 
                <!-- License Number -->
                <lightning-input
                    label="License Number"
                    name="licenseNumber"
                    value={licenseNumber}
                    type="text"
                    onchange={handleInputChange}
                    read-only={readOnly}
                    required>
                </lightning-input>
 
                <!-- Specialist -->
                <lightning-combobox
                    label="Specialist"
                    name="specialist"
                    value={specialist}
                    options={specialistOptions}
                    onchange={handleInputChange}
                    disabled={readOnly}
                    required>
                </lightning-combobox>
 
                <!-- Network -->
                <lightning-input
                    label="Network"
                    name="network"
                    value={network}
                    type="text"
                    onchange={handleInputChange}
                    read-only={readOnly}
                    required>
                </lightning-input>
 
            </div>
 
            <!-- File Upload Section -->
            <div class="upload-section">
 
                <h3 class="section-title">
                    Upload Supporting Document
                </h3>
 
                <lightning-input
                    type="file"
                    label="Select Document"
                    name="fileUpload"
                    accept=".pdf,.png,.jpg,.jpeg"
                    onchange={handleFileUpload}>
                </lightning-input>
 
                <template if:true={fileName}>
                    <div class="file-success">
                        ✅ Selected File: {fileName}
                    </div>
                </template>
 
                <template if:true={fileError}>
                    <div class="file-error">
                        ❌ {fileError}
                    </div>
                </template>
 
            </div>
 
        </div>
 
    </lightning-card>
</template>
